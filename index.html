<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>美食地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#34325c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="美食地圖">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* 預設風格（取自菜單圖片的深綠＋米白）。
   每間餐廳的專屬風格是在下方 script 的 THEMES 裡覆寫這些變數，沒有設定的餐廳就用這組。 */
:root{
  --font-body:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --font-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --bg:#f7efe5; --paper:#fffaf3; --field:#ffffff; --add-bg:#f4e6d6;
  --line:#e3d3c0; --ink:#2a2940; --muted:#6b6980; --gold:#b85a14; --danger:#b3392f;
  --accent:#34325c; --accent-deep:#26244a; --accent-mid:#4f4d82; --neutral:#8d8aa3; --hover:#ece9f5;
  --on-accent:#fff3e6; --go:#b85a14;
  --band:#34325c; --on-band:#fff3e6; --band-sub:#d9d5ee; --band-warn:#f5c9a0;
  --sec-head:#34325c; --on-sec:#fff3e6;
  --side-bg:#fffaf3; --side-active:#34325c; --on-side-active:#fff3e6;
  --scrim:rgba(30,28,56,.55); --toast-bg:#34325c; --toast-fg:#fff3e6;
  --radius:22px;
}
*{box-sizing:border-box}
html{overflow-y:scroll}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6}
[hidden]{display:none!important}
button{color:inherit}
input:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent-mid);outline-offset:2px}

/* 頁首 */
header{position:relative;background:var(--band);color:var(--on-band);text-align:center;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.hd-row{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
header h1{flex:0 1 auto;min-width:0;margin:0;line-height:44px;font-family:var(--font-display);font-size:28px;letter-spacing:.24em;font-weight:600;text-wrap:balance;overflow-wrap:anywhere}
.tagline{margin:0;font-size:13px;color:var(--band-sub);letter-spacing:.1em}
.summary{display:flex;justify-content:center;gap:18px;margin-top:4px;font-size:13px;color:var(--on-band)}
.hd-actions{position:absolute;right:max(12px,env(safe-area-inset-right,0px),calc(50% - 504px));top:calc(10px + env(safe-area-inset-top,0px));height:44px;display:flex;align-items:center;gap:6px}
.kebab{width:44px;padding:0;font-size:22px;line-height:1}
.more{position:absolute;right:0;top:calc(100% + 6px);z-index:55;min-width:150px;padding:6px;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 28px rgba(0,0,0,.28);display:flex;flex-direction:column}
.more button{background:none;border:none;border-radius:10px;font-family:inherit;font-size:15px;text-align:left;color:var(--ink);padding:10px 14px;min-height:44px;cursor:pointer}
.more button:hover{background:var(--hover)}
.more #restDelete{color:var(--danger)}
.menu-btn{display:none;position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));
  background:transparent;border:1px solid var(--band-sub);color:var(--on-band);border-radius:999px;font-family:inherit;font-size:15px;min-height:44px;padding:0 16px;cursor:pointer}
/* 加到主畫面（全螢幕）時，頂端狀態列會蓋住一段漸層：頁首整體往下挪，按鈕才不會被擋到 */
@media (display-mode: standalone){
  header{padding-top:calc(34px + env(safe-area-inset-top,0px))}
  .menu-btn,.hd-actions,.topnav{top:calc(34px + env(safe-area-inset-top,0px))}
}

/* 左側邊選單 + 內容 */
.layout{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);align-items:start;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:16px;margin:16px 16px 0 0;background:var(--side-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px}
.side-label{margin:0 0 8px 4px;font-size:12px;letter-spacing:.2em;color:var(--muted)}
.rests{display:flex;flex-direction:column;gap:6px}
.rtab{display:block;width:100%;min-height:42px;padding:8px 12px;border-radius:var(--radius);border:1px solid transparent;background:transparent;color:var(--ink);
  font-family:inherit;font-size:15px;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.rtab:hover{background:var(--hover)}
.rtab[aria-selected="true"]{background:var(--side-active);color:var(--on-side-active);font-weight:700}
.rtab.radd{margin-top:6px;border:1px dashed var(--accent-mid);color:var(--accent)}
.restform{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.restform input{min-width:0;font-family:inherit;font-size:15px;padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:var(--field);color:var(--ink)}
.restform .btns{display:flex;gap:8px}
.restform .btns button{flex:1}
.backdrop{display:none}
main{min-width:0;padding:0 0 16px}

.section{margin:12px 0 8px}
.section-head{display:flex;align-items:center;gap:10px;background:var(--sec-head);color:var(--on-sec);padding:10px 14px;border-radius:var(--radius) var(--radius) 0 0}
.section-head h2{margin:0;font-size:18px;letter-spacing:.2em;font-family:var(--font-display)}
.shbtn{background:transparent;border:1px solid var(--band-sub);color:var(--on-band);border-radius:999px;font-family:inherit;font-size:13px;min-height:40px;padding:0 12px;cursor:pointer;white-space:nowrap}
.shbtn:hover{background:rgba(255,255,255,.14)}
.card-list{background:var(--paper);border:1px solid var(--line);border-top:none;border-radius:0 0 var(--radius) var(--radius)}
.item{padding:12px 14px;border-bottom:1px dashed var(--line);min-width:0}
.item:last-child{border-bottom:none}
.item-top{display:flex;align-items:center;gap:8px}
.item-name{font-size:17px;font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere;margin:0}
.del{background:none;border:none;color:var(--muted);font-family:inherit;font-size:18px;cursor:pointer;padding:0 4px}
.del[data-armed]{font-size:13px;color:var(--danger)}
.del:hover{color:var(--danger)}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.col{min-width:0}
.rbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:54px;padding:6px 4px;line-height:1.3;border-radius:999px;background:var(--field);color:var(--ink);
  font-family:inherit;font-size:14px;font-weight:600;border:2px solid var(--accent-mid);cursor:pointer;transition:background .15s,color .15s}
.rbtn[data-r="great"]{border-color:var(--accent-deep)}
.rbtn[data-r="ok"]{border-color:var(--neutral)}
.rbtn[data-r="great"]:hover{background:var(--accent-deep);color:var(--on-accent)}
.rbtn[data-r="good"]:hover{background:var(--accent-mid);color:var(--on-accent)}
.rbtn[data-r="ok"]:hover{background:var(--neutral);color:var(--on-accent)}
.rbtn[data-r="bad"]{border-color:var(--danger);border-style:dashed;color:var(--danger)}
.rbtn[data-r="bad"]:hover{background:var(--danger);color:var(--on-accent)}
.rs{display:block;font-size:11px;font-weight:600;line-height:1.3}
.cnt[data-r="bad"]{color:var(--danger)}
.tag[data-r="bad"]{background:var(--danger)}
@media (max-width:520px){
  .opts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .summary{flex-wrap:wrap;gap:4px 14px}
}
.cnt{margin-top:6px;text-align:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.cnt[data-r="great"]{color:var(--accent-deep)}
.cnt[data-r="good"]{color:var(--accent-mid)}
.cnt[data-r="ok"]{color:var(--muted)}
.names{min-height:1.4em;margin-top:2px;text-align:center;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.notes{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.notes:empty{display:none}
.notes li{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.who{font-size:13px;font-weight:700}
.tag{font-size:11px;line-height:1.7;padding:0 8px;border-radius:999px;color:var(--on-accent)}
.tag[data-r="great"]{background:var(--accent-deep)}
.tag[data-r="good"]{background:var(--accent-mid)}
.tag[data-r="ok"]{background:var(--neutral)}
.said{flex:1 1 100%;margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.xnote{background:none;border:none;font-family:inherit;color:var(--muted);font-size:12px;padding:0 4px;cursor:pointer}
.xnote:hover,.xnote[data-armed]{color:var(--danger)}
.addnote{margin-top:8px;font-family:inherit;font-size:13px;color:var(--accent);background:none;border:none;padding:4px 0;text-decoration:underline;cursor:pointer}
.empty{margin:0;padding:18px 14px;color:var(--muted);font-size:14px;border-bottom:1px dashed var(--line)}
/* 找餐廳：圖卡 */
.pcount{margin:0;padding:10px 14px 0;font-size:13px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;padding:12px 12px 16px}
/* 每張卡佔 3 列（店名＋導航／地點／種類），用 subgrid 讓同一排的卡片上下對齊：店名 1 行的會跟著 2 行的往下移。
   第 1 列至少 44px 高，剛好放得下 2 行店名，也是導航按鈕的最小觸控尺寸 */
.pcard{grid-row:span 3;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:subgrid;row-gap:3px;column-gap:4px;min-width:0;
  padding:8px 8px 10px 12px;background:var(--field);border:1px solid var(--line);border-radius:16px;color:var(--ink);cursor:pointer;
  transition:border-color .15s,box-shadow .15s,transform .15s}
.pcard:hover{border-color:var(--accent-mid);box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-1px)}
.pname{grid-column:1;grid-row:1;align-self:start;margin:4px 0 0;font-size:15px;font-weight:700;line-height:1.35;text-wrap:balance;overflow-wrap:anywhere}
.pname .w{display:inline-block;max-width:100%;overflow-wrap:anywhere}
.ploc{grid-column:1 / -1;grid-row:2;margin:0;padding-right:4px;font-size:13px;color:var(--accent)}
.pcat{grid-column:1 / -1;grid-row:3;margin:0;padding-right:4px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.pcat b{color:var(--ink);font-weight:600}
.ploc span+span,.pcat span+span{margin-left:.8em}
.pgo{grid-column:2;grid-row:1;align-self:start;display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-2px -2px 0 0;border-radius:12px;
  color:var(--go);text-decoration:none}
.pgo svg{width:26px;height:26px;padding:5px;box-sizing:content-box;border-radius:50%;background:var(--go);color:#fff;fill:currentColor}
.pgo:hover svg{filter:brightness(1.12)}
.pgo:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
@media (max-width:520px){ .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
/* 找餐廳：詳情頁 */
#plist[hidden],#dview[hidden]{display:none}
.dback{margin:0 0 10px}
.dback button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--accent-mid);background:var(--field);color:var(--accent);font-family:inherit;font-size:15px;cursor:pointer}
.dhead{display:flex;align-items:flex-start;gap:12px;padding:18px 16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius)}
.dhead .pgo{flex:none;margin:-4px -4px 0 0}
@media (min-width:821px){ .dhead .pgo{width:44px;height:44px} .dhead .pgo svg{width:26px;height:26px;padding:5px} }
.dmain{flex:1;min-width:0}
.dname{margin:0;font-size:24px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.dloc,.dcat{margin:6px 0 0;font-size:15px;color:var(--accent)}
.dcat{margin-top:4px;font-size:14px;color:var(--muted)}
.dcat b{color:var(--ink);font-weight:600}
.dloc span+span,.dcat span+span{margin-left:.8em}
.drate{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px;font-size:15px}
.drate svg{width:18px;height:18px;flex:none;fill:var(--go)}
.drate b{font-weight:700}
.dsrc{display:inline-flex;gap:10px;margin-left:8px}
.dsrc a{position:relative;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);text-decoration:none}
.dsrc a:hover{background:var(--hover)}
.dsrc a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dsrc svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dsrc i{position:absolute;top:-6px;right:-6px;width:17px;height:17px;border-radius:50%;background:var(--go);color:#fff;font-size:11px;font-style:normal;font-weight:700;line-height:17px;text-align:center}
.dgrid{display:grid;gap:12px;margin-top:12px}
.dleft{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (min-width:821px){ .dgrid{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:start} }
.dsec{padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius)}
.dsec h3{display:flex;align-items:center;gap:6px;margin:0 0 8px;font-size:14px;font-weight:700;color:var(--go)}
.dsec svg,.drow>svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dtext{margin:0;font-size:15px;line-height:1.7;white-space:pre-line;overflow-wrap:anywhere}
.dnone{margin:0;font-size:14px;color:var(--muted)}
.dchips{display:flex;flex-wrap:wrap;gap:8px}
.dchips span{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--field);font-size:14px}
.dinfo{padding-top:4px;padding-bottom:4px}
.drow{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px dashed var(--line)}
.drow:first-child{border-top:none}
.drow>svg{margin-top:2px;color:var(--go)}
.drow>div{flex:1;min-width:0}
.dlabel{display:block;font-size:12px;color:var(--muted)}
.drow .dtext{margin-top:2px}
.dcopy{flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-8px -10px -8px 0;border:none;background:none;color:var(--muted);cursor:pointer}
.dcopy:hover{color:var(--ink)}
.dcopy svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:821px){ .pgo{width:34px;height:34px;margin:0 0 0 0} .pgo svg{width:18px;height:18px;padding:5px} }
#findView .card-list{border-top:1px solid var(--line);border-radius:var(--radius)}
/* 找餐廳：篩選列（總覽／縣市／市區／種類，後三個可下拉複選） */
.fbar{display:flex;width:fit-content;margin:0 auto 10px;padding:4px;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px}
.fbar button{display:flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;padding:0 18px;border:none;border-radius:999px;background:transparent;
  font-family:inherit;font-size:15px;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
.fbar button:hover{color:var(--ink)}
.fbar button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.fbar svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fwrap{position:relative;width:fit-content;margin:0 auto 10px}
.fwrap .fbar{margin:0}
.fbar button{position:relative}
.fn{position:absolute;top:3px;right:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--go);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.fn[hidden]{display:none}
.fbar button[aria-pressed="true"] .fn{background:#fff;color:var(--accent)}
.fbar button.open{box-shadow:inset 0 0 0 2px var(--accent-mid)}
.fpanel{position:absolute;z-index:30;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:min(360px,calc(100vw - 24px));padding:10px;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.fpanel[hidden]{display:none}
.fphead{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 8px;font-weight:700;color:var(--ink)}
.fphead span{font-size:12px;font-weight:400;color:var(--muted)}
.fplist{max-height:min(48vh,340px);overflow-y:auto;margin:0 -4px;padding:0 4px}
.fopt{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:12px;cursor:pointer;color:var(--ink);font-size:15px}
.fopt:hover{background:var(--hover)}
.fopt input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.fopt .fl{flex:1;min-width:0;overflow-wrap:anywhere}
.fopt .fl em{margin-left:6px;font-style:normal;font-size:12px;color:var(--muted)}
.fopt .fc{font-size:12px;color:var(--muted)}
.fpfoot{display:flex;gap:8px;margin-top:8px}
.fpfoot button{flex:1;min-height:42px;border-radius:999px;border:1px solid var(--accent-mid);background:var(--field);color:var(--accent);font-family:inherit;font-size:15px;cursor:pointer}
.fpfoot button[data-act="fclose"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
@media (max-width:820px){ .fbar button{min-width:60px;padding:0 20px} .fbar .ft{display:none} }
body[data-view="find"] .layout{max-width:1280px}
.add{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;background:var(--add-bg);border-bottom:1px solid var(--line)}
.sugg{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sugg button{font-family:inherit;font-size:13px;min-height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--accent-mid);background:var(--field);color:var(--ink);cursor:pointer}
.sugg button:hover{background:var(--hover)}
.item.flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{background:var(--hover)}100%{background:transparent}}
.add input{flex:1;min-width:0;font-family:inherit;font-size:14px;padding:7px 16px;border:1px solid var(--line);border-radius:999px;background:var(--field);color:var(--ink)}
.add button,.primary{font-family:inherit;background:var(--accent);color:var(--on-accent);border:none;border-radius:999px;padding:7px 18px;cursor:pointer}
.add button:hover,.primary:hover{background:var(--accent-deep)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ghost{font-family:inherit;font-size:14px;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 18px;cursor:pointer}
.add .ghost,.restform .ghost{background:var(--field);color:var(--ink)}
.add .ghost:hover,.restform .ghost:hover{background:var(--hover)}
.hint{font-size:12px;letter-spacing:.06em;color:var(--muted);text-align:center;margin:26px 0 calc(40px + env(safe-area-inset-bottom,0px))}
.hint[data-s="error"]{color:var(--danger)}

/* 第一階層導覽：找餐廳 / 寫評價（桌機在頁首下方，手機固定在畫面底部） */
.topnav{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px),calc(50% - 504px));z-index:30;display:flex;width:230px;height:44px;padding:4px;border:1px solid rgba(0,0,0,.08);border-radius:999px;
  background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.topnav::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:rgba(0,0,0,.09);transition:transform .25s cubic-bezier(.3,.8,.3,1)}
.topnav[data-v="review"]::before{transform:translateX(100%)}
.topnav button{position:relative;flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:4px;padding:0;background:none;border:none;border-radius:999px;font-family:inherit;font-size:14px;letter-spacing:.1em;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
.topnav button:hover{color:var(--ink)}
.topnav button[aria-current="page"]{color:var(--accent-deep);font-weight:700}
.ni{display:inline;font-size:15px;line-height:1}
/* 電腦版：改名/刪除餐廳直接並排顯示，不收成下拉選單 */
@media (min-width:821px){
  .kebab{display:none}
  .more,.more[hidden]{position:static;display:flex!important;flex-direction:row;gap:6px;min-width:0;padding:0;background:none;border:none;border-radius:0;box-shadow:none}
  .more button{border:1px solid var(--band-sub);color:var(--on-band);border-radius:999px;font-size:13px;min-height:40px;padding:0 12px;text-align:center;white-space:nowrap}
  .more button:hover{background:rgba(255,255,255,.14)}
  .more #restDelete{color:var(--on-band)}
}
body[data-view="find"] .menu-btn,body[data-view="find"] .hd-actions,body[data-view="find"] .side,body[data-view="find"] .backdrop{display:none!important}
body[data-view="find"] .layout{grid-template-columns:minmax(0,1fr)}
body[data-view="find"] main{width:100%;max-width:none}

/* 留言身分頁面 */
.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:stretch;justify-content:center;z-index:60}
.panel{width:100%;max-width:520px;height:100%;overflow:auto;background:var(--paper);
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:600px){ .overlay{align-items:center} .panel{height:auto;max-height:92vh;border-radius:28px} }
.back{background:none;border:none;font-family:inherit;color:var(--accent);font-size:15px;padding:6px 0;margin-bottom:6px;cursor:pointer}
.panel h2{margin:0 0 4px;font-size:22px;letter-spacing:.14em;font-family:var(--font-display)}
.sub{margin:0;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.label{margin:14px 0 6px;font-size:12px;letter-spacing:.12em;color:var(--muted)}
.members{display:flex;flex-wrap:wrap;gap:8px}
.mbtn{min-height:42px;padding:6px 16px;border-radius:999px;border:1px solid var(--accent-mid);background:var(--field);color:var(--ink);font-family:inherit;font-size:15px;text-align:left;cursor:pointer}
.mbtn:hover{background:var(--hover)}
.mbtn small{display:block;font-size:11px;color:var(--muted);line-height:1.2}
.nomem{color:var(--muted);font-size:13px}
.newmem{display:flex;gap:8px}
.newmem input{flex:1;min-width:0;font-family:inherit;font-size:15px;padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:var(--field);color:var(--ink)}
.panel textarea{display:block;width:100%;min-height:64px;resize:vertical;font-family:inherit;font-size:15px;padding:10px 14px;border:1px solid var(--line);border-radius:18px;background:var(--field);color:var(--ink)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);background:var(--toast-bg);color:var(--toast-fg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:70}

/* 品項卡片（桌機、手機共用）：每個餐點獨立一張卡，餐點名稱為主、評價按鈕為輔 */
#reviewView .card-list{overflow:visible;border:none;border-radius:0;background:transparent}
.add{border:1px solid var(--line);border-radius:16px;margin-bottom:12px}
.empty{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-bottom:12px}
.item{background:var(--paper);border:none!important;border-radius:16px;margin-bottom:12px;padding:14px;box-shadow:0 0 0 1px var(--line),0 2px 6px rgba(0,0,0,.06)}
.item-name{font-size:20px;font-weight:700;line-height:1.35}
.opts{gap:8px 8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.rbtn{flex-direction:row;flex-wrap:wrap;gap:0 4px;min-height:42px;padding:4px 8px;font-size:13px;font-weight:500;border-width:1.5px}
.rs{display:inline;font-size:10px;font-weight:400}
.cnt{margin-top:4px;font-size:12px;font-weight:600}
.names{font-size:11px}
.notes{margin-top:12px;padding:10px 12px;background:var(--add-bg);border-top:none;border-radius:12px}

/* 手機：餐廳選單改成左上角的下拉選單；第一階層頁籤變成底部的浮動膠囊列 */
@media (max-width:820px){
  .menu-btn{display:block}
  .layout{display:block}
  .side{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));z-index:50;width:min(78vw,280px);max-height:calc(100vh - 170px);margin:0;overflow:auto;padding:12px;
    border-radius:18px;box-shadow:0 10px 28px rgba(0,0,0,.28);opacity:0;transform:translateY(-6px);visibility:hidden;transition:opacity .15s ease,transform .15s ease,visibility 0s linear .15s}
  .side.open{opacity:1;transform:none;visibility:visible;transition:opacity .15s ease,transform .15s ease}
  .backdrop{position:fixed;inset:0;z-index:45;background:var(--scrim)}
  .backdrop.open{display:block}
  main{padding:0 max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
  .layout{padding-left:0;padding-right:0}
  header{padding-bottom:8px}
  .hd-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
  .menu-btn,.hd-actions{position:relative;top:auto;left:auto;right:auto}
  .menu-btn{grid-column:1;justify-self:start;min-height:40px;padding:0 12px;font-size:14px;white-space:nowrap}
  .hd-actions{grid-column:3;justify-self:end}
  .shbtn{min-height:40px;padding:0 10px}
  .kebab{width:40px;padding:0}
  header h1{grid-column:2;max-width:100%;font-size:20px;letter-spacing:.1em;line-height:1.25;margin:0 auto}
  .summary{margin-top:2px}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .topnav{position:fixed;top:auto;height:auto;left:50%;bottom:max(8px,calc(env(safe-area-inset-bottom,0px) - 20px));transform:translateX(-50%);z-index:40;width:min(calc(100% - 32px),360px);padding:5px;border:1px solid rgba(0,0,0,.08);border-radius:999px;
    background:rgba(255,255,255,.82);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .topnav::before{top:5px;bottom:5px;left:5px;width:calc(50% - 5px)}
  .topnav button{flex-direction:column;gap:0;min-height:54px;font-size:13px;letter-spacing:.12em;line-height:1.3}
  .ni{display:block;font-size:20px;line-height:1.2}
  #toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  /* 品項卡片：每個餐點獨立一張卡，餐點名稱為主、評價按鈕為輔 */
  .section-head{border-radius:var(--radius);margin-bottom:10px}
  .card-list{background:transparent;border:none;border-radius:0}
}
@media (max-width:820px) and (display-mode: standalone){
  .side{top:calc(86px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion: reduce){ .rbtn,.side,.side.open,.topnav::before{transition:none} }
</style>
<style id="themeCss"></style>
</head>
<body>
<header>
  <div class="hd-row">
    <button type="button" class="menu-btn" id="menuBtn" aria-controls="side" aria-expanded="false">餐廳 ▾</button>
    <h1 id="restTitle"></h1>
    <div class="hd-actions">
      <button type="button" class="shbtn kebab" id="moreBtn" aria-haspopup="menu" aria-expanded="false" aria-label="餐廳選項">⋮</button>
      <div class="more" id="moreMenu" role="menu" hidden><button type="button" role="menuitem" id="restRename">編輯名稱</button><button type="button" role="menuitem" id="restDelete">刪除餐廳</button></div>
    </div>
  </div>
  <div class="summary" id="sumReview">
    <span>超好吃 <b id="c1">0</b></span>
    <span>好吃 <b id="c2">0</b></span>
    <span>普通 <b id="c3">0</b></span>
    <span>有點雷 <b id="c4">0</b></span>
  </div>
</header>
<nav class="topnav" id="topnav" aria-label="主要功能">
  <button type="button" data-act="view" data-v="find"><span class="ni" aria-hidden="true">🔎</span>找餐廳</button>
  <button type="button" data-act="view" data-v="review"><span class="ni" aria-hidden="true">📝</span>寫評價</button>
</nav>

<div class="backdrop" id="backdrop"></div>
<div class="layout">
  <aside class="side" id="side" aria-label="餐廳選單">
    <p class="side-label">寫評價・餐廳</p>
    <nav class="rests" id="rests" role="tablist" aria-orientation="vertical" aria-label="餐廳"></nav>
    <form class="restform" id="restForm" autocomplete="off" hidden>
      <input id="restName" maxlength="20" aria-label="餐廳名稱" placeholder="餐廳名稱">
      <div class="btns">
        <button type="submit" class="primary" id="restSubmit">新增</button>
        <button type="button" class="ghost" id="restCancel">取消</button>
      </div>
    </form>
  </aside>

  <main>
    <section class="section" id="findView" hidden>
      <div class="fwrap" id="fwrap">
      <div class="fbar" id="fbar" role="group" aria-label="篩選">
        <button type="button" data-act="fmode" data-m="all" aria-label="總覽" title="總覽"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span class="ft">總覽</span></button>
        <button type="button" data-act="fmode" data-m="county" aria-label="縣市" title="縣市" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5 9 4.5l6 2 5.5-2v13l-5.5 2-6-2-5.5 2z"/><path d="M9 4.5v13M15 6.5v13"/></svg><span class="ft">縣市</span><span class="fn" hidden></span></button>
        <button type="button" data-act="fmode" data-m="district" aria-label="市區" title="市區" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg><span class="ft">市區</span><span class="fn" hidden></span></button>
        <button type="button" data-act="fmode" data-m="type" aria-label="種類" title="種類" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v6.5a3 3 0 0 0 6 0V3M9 12.5V21M17.5 21V3c-2.7 1.2-4 4-4 7.5 0 2 .9 3 2 3h2"/></svg><span class="ft">種類</span><span class="fn" hidden></span></button>
      </div>
      <div class="fpanel" id="fpanel" hidden></div>
      </div>
      <div class="card-list" id="plist">
        <p class="pcount" id="pcount" hidden></p>
        <p class="empty" id="pempty" hidden></p>
        <div class="pgrid" id="pgrid"></div>
      </div>
      <div class="dview" id="dview" hidden></div>
    </section>

    <section class="section" id="reviewView">
      <div class="card-list">
        <form class="add" id="addForm" autocomplete="off">
          <input id="newName" maxlength="40" placeholder="新增品項名稱" aria-label="新增品項名稱">
          <button type="submit">新增</button>
          <div class="sugg" id="sugg" hidden></div>
        </form>
        <p class="empty" id="empty" hidden>這間餐廳還沒有品項。在上方輸入名字新增，再點「超好吃」「好吃」「普通」「有點雷」，選擇是誰要評。</p>
        <div id="list"></div>
      </div>
    </section>

    <p class="hint" id="conn"></p>
  </main>
</div>

<div class="overlay" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <button class="back" type="button" id="sheetBack">‹ 返回</button>
    <h2 id="sheetTitle">留言身分</h2>
    <p class="sub" id="sheetSub"></p>
    <div id="pickBox">
      <p class="label">選擇留言身分（新增過的身分會保留，其他品項也能直接選）</p>
      <div class="members" id="memberList"></div>
      <p class="label">新增身分</p>
      <div class="newmem">
        <input id="newMember" maxlength="12" placeholder="例：爸爸、媽媽、小明" aria-label="新身分名字" autocomplete="off">
        <button class="ghost" type="button" id="addMember">新增並選取</button>
      </div>
    </div>
    <p class="label"><label for="sheetNote" id="sheetNoteLabel">備註（選填，留空就不更動原本的備註）</label></p>
    <textarea id="sheetNote" maxlength="300" placeholder="口感、部位、推薦吃法…"></textarea>
    <div class="row"><button class="primary" type="button" id="noteSave" hidden>儲存修改</button><button class="ghost" type="button" id="sheetClose">取消</button></div>
  </div>
</div>
<div id="toast" role="status" hidden></div>

<script>
(function(){
  // ★ 設定：把 Apps Script 部署後得到的網址（結尾是 /exec）貼在引號裡。
  //   留空的話，資料只會存在這支手機的瀏覽器，不會和家人同步。
  var API_URL = "https://script.google.com/macros/s/AKfycbzFvA2VTw_35WXoQVMAmzImIGqduM93SeCfqy3CQKOUCB7ExuUNQ3rRqjsqTlqjGBjj/exec";
  var POLL_MS = 20000;

  var KEY = "meat-rating-v2";

  var DEFAULT_RNAME = "茶六";
  var REMOTE = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(API_URL);
  /* t 是存進試算表的值（不可改）；s 只是按鈕上顯示的小字 */
  var R = [ {k:"great", t:"超好吃", s:"(必點)"}, {k:"good", t:"好吃", s:""}, {k:"ok", t:"普通", s:""}, {k:"bad", t:"有點雷", s:"(下次不會點)"} ];
  var KEYOF = {"超好吃":"great", "好吃":"good", "普通":"ok", "有點雷":"bad"};
  var BAD = {"__proto__":1, "constructor":1, "prototype":1};
  var $ = function(s){ return document.querySelector(s); };

  // ★ 各餐廳的專屬風格。沒有設定的餐廳都用預設（菜單圖片的深綠＋米白）。

  //   fontUrl 可填 Google Fonts 的網址。餐廳改名後要同步改這裡的 key。

  var THEMES = {
    // 茶六：深綠＋奶油色（原本的預設風格；預設改成 Logo 配色後，茶六改由這裡維持原樣）
    "茶六": {
      fontUrl: "",
      vars: {
        "--bg":"#f5f2e9", "--paper":"#fbf9f3", "--field":"#ffffff", "--add-bg":"#efece0",
        "--line":"#d9d4c3", "--ink":"#2b2b2b", "--muted":"#6f6f60", "--gold":"#8f6f25", "--danger":"#a33",
        "--accent":"#2f5d4a", "--accent-deep":"#1f4434", "--accent-mid":"#3f7360", "--neutral":"#8d8d7a", "--hover":"#eaf2ee",
        "--on-accent":"#ffffff",
        "--band":"#1f4434", "--on-band":"#ffffff", "--band-sub":"#cfe0d6", "--band-warn":"#f1c9a8",
        "--sec-head":"#2f5d4a", "--on-sec":"#ffffff",
        "--side-bg":"#fbf9f3", "--side-active":"#1f4434", "--on-side-active":"#ffffff",
        "--scrim":"rgba(20,28,24,.55)", "--toast-bg":"#2b2b2b", "--toast-fg":"#f5f2e9"
      }
    },
    // 大師兄銷魂麵鋪：奶白紙面、酒紅玫瑰色、細明體、細線框標題、點線分隔（取自該店菜單）
    "大師兄": {
      fontUrl: "",
      vars: {
        "--bg":"#f1e9e5", "--paper":"#fffdfb", "--field":"#ffffff", "--add-bg":"#f8eeec",
        "--line":"#dccbc7", "--ink":"#2b2324", "--muted":"#7b6c6c", "--danger":"#a8323a",
        "--accent":"#a24d5c", "--accent-deep":"#7e3342", "--accent-mid":"#b86a78", "--neutral":"#8c8482", "--hover":"#f7eceb",
        "--on-accent":"#ffffff",
        "--band":"#a24d5c", "--on-band":"#ffffff", "--band-sub":"#f3dadd", "--band-warn":"#ffe3dd",
        "--sec-head":"#a24d5c", "--on-sec":"#ffffff",
        "--side-bg":"#fffdfb", "--side-active":"#a24d5c", "--on-side-active":"#ffffff",
        "--scrim":"rgba(43,20,24,.55)", "--toast-bg":"#7e3342", "--toast-fg":"#ffffff",
        "--font-body":"\"Noto Serif TC\",\"Songti TC\",\"PMingLiU\",serif", "--font-display":"\"Noto Serif TC\",\"Songti TC\",\"PMingLiU\",serif"
      },

    "享鴨": {
      fontUrl: "",
      vars: {

        "--line":"#e6d3cb", "--ink":"#161616", "--muted":"#655d59", "--danger":"#b3261e",
        "--accent":"#c4281c", "--accent-deep":"#161616", "--accent-mid":"#c4281c", "--neutral":"#6b6b6b", "--hover":"#fde3d8",

      },
      css: [
        "header h1{display:block;box-sizing:border-box;width:fit-content;max-width:100%;margin:0 auto;padding:0 .46em 0 .7em;text-align:center;background:#f8b9a0;color:#161616}",

        ".item{border-bottom-style:dotted;border-bottom-color:#9a8f89}",

        ".rbtn{border-color:#161616}",
        ".rbtn[data-r=\"good\"]{border-color:#c4281c}",

    spark:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>',
    heart:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
    clock:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
    cal:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>',
    pin:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>',
    copy:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5"/></svg>'
  };
  function detailIndex(list){
    var m = /^#find\/(\d+)$/.exec(location.hash || "");
    return m && list[+m[1]] ? +m[1] : -1;
  }
  function dText(v){ return v ? '<p class="dtext">' + esc(v) + '</p>' : '<p class="dnone">尚未填寫</p>'; }
  function dRow(icon, label, body, extra){
    return '<div class="drow">' + DI[icon] + '<div><span class="dlabel">' + label + '</span>' + body + '</div>' + (extra || "") + '</div>';
  }
  function detailHTML(p){
    var loc = [p.county, p.district].filter(Boolean).map(function(t){ return "<span>" + esc(t) + "</span>"; }).join("");
    var cat = catHTML(p.tags || []);
    var posts = (p.posts || []).filter(function(u){ return /^https:\/\//.test(u); }).slice(0, 2);
    var src = posts.map(function(u, i){
      return '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer" aria-label="查看原貼文' + (posts.length > 1 ? " " + (i + 1) : "") + '" title="查看原貼文">' + DI.ig + (posts.length > 1 ? "<i>" + (i + 1) + "</i>" : "") + '</a>';
    }).join("");
    var rate = p.rating ? DI.star + "<b>" + (+p.rating).toFixed(1) + "</b><span>Google 星數</span>" : '<span class="dnone">尚無 Google 星數</span>';
    var picks = (p.picks || []).length ? '<div class="dchips">' + p.picks.map(function(t){ return "<span>" + esc(t) + "</span>"; }).join("") + "</div>" : '<p class="dnone">尚未填寫</p>';
    var copy = p.address ? '<button type="button" class="dcopy" data-act="dcopy" data-v="' + esc(p.address) + '" aria-label="複製地址" title="複製地址">' + DI.copy + '</button>' : "";
    return '<div class="dback"><button type="button" data-act="dback">‹ 返回</button></div>' +
      '<article class="dhead"><div class="dmain"><h2 class="dname">' + esc(p.name) + '</h2>' +
      (loc ? '<p class="dloc">' + loc + '</p>' : '') + (cat ? '<p class="dcat">' + cat + '</p>' : '') +
      '<div class="drate">' + rate + (src ? '<span class="dsrc">' + src + '</span>' : '') + '</div></div>' +
      '<a class="pgo" href="' + esc(mapURL(p)) + '" target="_blank" rel="noopener noreferrer" aria-label="導航到 ' + esc(cleanName(p.name)) + '（Google 地圖）" title="導航"><svg viewBox="0 0 24 24" aria-hidden="true"><path transform="translate(0 .8) rotate(45 12 11.2) scale(.92) translate(.96 .9)" d="M12 2 4.5 20.3 12 16.5l7.5 3.8z"/></svg></a></article>' +
      '<div class="dgrid"><div class="dleft">' +
      '<section class="dsec"><h3>' + DI.spark + '特色</h3>' + dText(p.feature) + '</section>' +
      '<section class="dsec"><h3>' + DI.heart + '推薦餐點</h3>' + picks + '</section></div>' +
      '<section class="dsec dinfo">' +
      dRow("clock", "營業時間", dText(p.hours)) +
      dRow("cal", "公休日", '<p class="dtext">' + esc(p.closed || "無") + '</p>') +
      dRow("pin", "地址", dText(p.address), copy) + '</section></div>';
  }
  function renderFind(){
    loadPlaces();
    var list = PLACES || [], di = detailIndex(list);
    $("#fwrap").hidden = $("#plist").hidden = di >= 0;
    $("#dview").hidden = di < 0;
    if(di >= 0){
      DETAIL_ON = true;
      $("#dview").innerHTML = detailHTML(list[di]);
      return;
    }
    var opts = filterOptions(list);
    FA.county = FA.county.filter(function(k){ return opts.county.some(function(o){ return o.k === k; }); });
    opts = filterOptions(list);
    FA.district = FA.district.filter(function(k){ return opts.district.some(function(o){ return o.k === k; }); });
    FA.type = FA.type.filter(function(k){ return opts.type.some(function(o){ return o.k === k; }); });
    var any = FA.county.length + FA.district.length + FA.type.length;
    Array.prototype.forEach.call(document.querySelectorAll("#fbar button"), function(b){
      var m = b.dataset.m, n = m === "all" ? 0 : FA[m].length, badge = b.querySelector(".fn");
      b.setAttribute("aria-pressed", m === "all" ? String(!any) : String(n > 0));
      b.classList.toggle("open", FOpen === m);
      if(m !== "all") b.setAttribute("aria-expanded", FOpen === m ? "true" : "false");
      if(badge){ badge.hidden = !n; badge.textContent = n; }
    });
    renderPanel(opts);
    var items = list.filter(placeOK);
    $("#pgrid").innerHTML = items.map(placeCard).join("");
    var sel = ["county", "district", "type"].map(function(kind){
      return opts[kind].filter(function(o){ return FA[kind].indexOf(o.k) >= 0; }).map(function(o){ return o.l; }).join("、");
    }).filter(Boolean).join(" ・ ");
    $("#pcount").hidden = !list.length;
    $("#pcount").textContent = "共 " + items.length + " 間" + (sel ? "　" + sel : "");
    $("#pempty").hidden = list.length > 0;
    $("#pempty").textContent = PLACES === null || list.length ? "" : "還沒有餐廳資料。";
    if(DETAIL_ON){ DETAIL_ON = false; window.scrollTo(0, PDscroll); }
  }

  function render(){
    if(!findRest(cur)) pickCurrent();
    $("#rests").innerHTML = S.restaurants.map(function(r){
      return '<button type="button" class="rtab" role="tab" aria-selected="' + (r.id === cur ? "true" : "false") + '" data-act="pickrest" data-id="' + esc(r.id) + '">' + esc(r.name) + '</button>';
    }).join("") + '<button type="button" class="rtab radd" data-act="addrest">＋ 新增餐廳</button>';
    var rest = findRest(cur);
    var isFind = view === "find";
    document.body.setAttribute("data-view", view);
    Array.prototype.forEach.call(document.querySelectorAll("#topnav button"), function(b){
      b.setAttribute("aria-current", b.dataset.v === view ? "page" : "false");
    });
    $("#topnav").dataset.v = view;
    $("#findView").hidden = !isFind;
    $("#reviewView").hidden = isFind;
    $("#sumReview").hidden = isFind;
    if(isFind){
      applyTheme(null);
      setTitle("找餐廳");
      document.title = "美食地圖";
      renderFind();
      return;
    }
    setTitle(rest ? rest.name : "");
    applyTheme(rest);
    $("#restDelete").hidden = S.restaurants.length < 2;
    document.title = "美食地圖";
    var items = S.items.filter(function(i){ return i.rid === cur; });
    $("#list").innerHTML = items.map(itemHTML).join("");
    $("#empty").hidden = items.length > 0;
    var c = {"超好吃":0, "好吃":0, "普通":0, "有點雷":0};
    items.forEach(function(it){
      var v = it.votes || {};
      Object.keys(v).forEach(function(m){ if(c[v[m].r] != null) c[v[m].r]++; });
    });
    $("#c1").textContent = c["超好吃"];
    $("#c2").textContent = c["好吃"];
    $("#c3").textContent = c["普通"];
    $("#c4").textContent = c["有點雷"];
    renderSugg();
  }

  /* ---------- 新增品項時，列出已存在的相似品項 ---------- */
  function similar(q){
    q = q.trim().toLowerCase();
    if(!q) return [];
    var scored = [];
    S.items.forEach(function(i){
      if(i.rid !== cur) return;
      var n = i.name.trim().toLowerCase(), sc = 0;
      if(n.indexOf(q) >= 0 || q.indexOf(n) >= 0) sc = 3;
      else if(q.length >= 2){
        var same = 0;
        for(var k = 0; k < q.length; k++) if(n.indexOf(q.charAt(k)) >= 0) same++;
        if(same >= 2 && same >= q.length * 0.6) sc = 1;
      }
      if(sc) scored.push({ i:i, sc:sc });
    });
    scored.sort(function(a, b){ return b.sc - a.sc; });
    return scored.slice(0, 6).map(function(x){ return x.i; });
  }
  function renderSugg(){
    var box = $("#sugg"), list = similar($("#newName").value);
    box.hidden = !list.length;
    box.innerHTML = list.length ? '已有類似品項，點一下前往：' + list.map(function(i){
      return '<button type="button" data-act="gotoitem" data-id="' + esc(i.id) + '">' + esc(i.name) + '</button>';
    }).join("") : "";
  }
  $("#newName").addEventListener("input", renderSugg);
  function gotoItem(id){
    var el = document.querySelector('.item[data-iid="' + id + '"]');
    if(!el) return;
    $("#newName").value = ""; renderSugg();
    el.scrollIntoView({ behavior:"smooth", block:"center" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  }

  /* ---------- 餐廳：新增 / 改名 / 刪除 ---------- */
  var restMode = "add";
  function openRestForm(mode){
    restMode = mode;
    var f = $("#restForm"), inp = $("#restName");
    f.hidden = false;
    if(window.matchMedia("(max-width:820px)").matches) setDrawer(true);
    inp.value = mode === "rename" ? (findRest(cur) || {}).name || "" : "";
    inp.placeholder = mode === "rename" ? "新的餐廳名稱" : "餐廳名稱，例：屋馬燒肉";
    $("#restSubmit").textContent = mode === "rename" ? "儲存" : "新增";
    inp.focus(); inp.select();
  }
  function closeRestForm(){ $("#restForm").hidden = true; }
  function nameTaken(name, exceptId){
    return S.restaurants.some(function(r){ return r.id !== exceptId && r.name.trim().toLowerCase() === name.toLowerCase(); });
  }
  $("#restForm").addEventListener("submit", function(e){
    e.preventDefault();
    var name = $("#restName").value.trim();
    if(!name) return;
    if(BAD[name]){ toast("這個名字不能用，請換一個"); return; }
    if(restMode === "rename"){
      if(nameTaken(name, cur)){ toast("已經有「" + name + "」了"); return; }
      findRest(cur).name = name;
      send({ op:"renameRestaurant", id:cur, name:name });
    } else {
      if(nameTaken(name, "")){ toast("已經有「" + name + "」了"); return; }
      if(S.restaurants.length >= 30){ toast("餐廳數量已達上限"); return; }
      var r = { id:newId("r"), name:name };
      S.restaurants.push(r);
      send({ op:"addRestaurant", id:r.id, name:name });
      setCurrent(r.id);
    }
    save(); closeRestForm(); closeDrawer(); render();
    toast(restMode === "rename" ? "已更新名稱" : "已新增「" + name + "」，現在可以新增品項了");
  });
  $("#restCancel").addEventListener("click", closeRestForm);
  function setMore(open){
    $("#moreMenu").hidden = !open;
    $("#moreBtn").setAttribute("aria-expanded", open ? "true" : "false");
  }
  $("#moreBtn").addEventListener("click", function(e){ e.stopPropagation(); setMore($("#moreMenu").hidden); });
  document.addEventListener("click", function(e){ if(!e.target.closest("#moreMenu")) setMore(false); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") setMore(false); });
  $("#restRename").addEventListener("click", function(){ setMore(false); openRestForm("rename"); });
  $("#restDelete").addEventListener("click", function(e){
    var b = e.currentTarget;
    if(!b.dataset.armed) toast("再按一次，會刪除這間餐廳的所有品項與評分");
    arm(b, "確定刪除？", function(){
      var id = cur;
      S.restaurants = S.restaurants.filter(function(r){ return r.id !== id; });
      S.items = S.items.filter(function(i){ return i.rid !== id; });
      send({ op:"delRestaurant", id:id });
      setCurrent(S.restaurants[0].id);
      save(); setMore(false); closeRestForm(); closeDrawer(); render(); toast("已刪除餐廳");
    });
  });

  /* ---------- 留言身分 ---------- */
  var sheet = { id:null, v:null, edit:null };
  function setEditMode(m){
    sheet.edit = m;
    $("#pickBox").hidden = !!m;
    $("#noteSave").hidden = !m;
    $("#sheetTitle").textContent = m ? "編輯備註" : "留言身分";
    $("#sheetNoteLabel").textContent = m ? "備註內容" : "備註（選填，留空就不更動原本的備註）";
  }
  function openEdit(id, m){
    var it = findItem(id);
    if(!it || !it.votes || !it.votes[m]) return;
    sheet.id = id; sheet.v = null;
    setEditMode(m);
    $("#sheetSub").textContent = (findRest(cur) ? findRest(cur).name + "・" : "") + "「" + it.name + "」・" + m + " 的備註";
    $("#sheetNote").value = it.votes[m].n || "";
    $("#sheet").hidden = false;
    $("#sheetNote").focus();
  }
  function saveEdit(){
    var it = findItem(sheet.id), m = sheet.edit;
    if(!it || !m || !it.votes || !it.votes[m]){ closeSheet(); return; }
    var note = $("#sheetNote").value.trim();
    if(!note){ toast("備註不能留空，要清除請按「刪除備註」"); return; }
    var c = it.votes[m];
    c.n = note; c.t = Date.now();
    send({ op:"setVote", itemId:it.id, member:m, r:c.r || "", n:c.n, t:c.t });
    save(); closeSheet(); render(); toast("已更新備註");
  }
  function openSheet(id, v){
    sheet.id = id; sheet.v = v;
    setEditMode(null);
    var it = findItem(id);
    $("#sheetSub").textContent = (findRest(cur) ? findRest(cur).name + "・" : "") + "「" + (it ? it.name : "") + "」・" + (v ? "你選了「" + v + "」" : "留下備註");
    $("#sheetNote").value = "";
    $("#newMember").value = "";
    renderMembers();
    $("#sheet").hidden = false;
    var first = $("#memberList .mbtn") || $("#newMember");
    if(first) first.focus();
  }
  function closeSheet(){ $("#sheet").hidden = true; sheet.id = null; }
  function renderMembers(){
    var it = findItem(sheet.id) || {};
    var votes = it.votes || {};
    $("#memberList").innerHTML = S.members.length ? S.members.map(function(m){
      var c = votes[m] && votes[m].r;
      return '<button type="button" class="mbtn" data-m="' + esc(m) + '">' + esc(m) + (c ? '<small>目前：' + esc(c) + '</small>' : '') + '</button>';
    }).join("") : '<span class="nomem">還沒有身分，請在下方輸入名字。</span>';
  }
  function apply(member){
    var it = findItem(sheet.id);
    if(!it) return;
    it.votes = it.votes || {};
    var c = it.votes[member] || { r:"", n:"" };
    var note = $("#sheetNote").value.trim();
    var msg;
    if(sheet.v){
      c.r = (c.r === sheet.v) ? "" : sheet.v;
      if(note) c.n = note;
      msg = c.r ? member + " 選了「" + c.r + "」" : member + " 取消了評價";
    } else {
      if(!note){ toast("請先輸入備註內容"); return; }
      c.n = note;
      msg = member + " 留下了備註";
    }
    c.t = Date.now();
    if(c.r || c.n) it.votes[member] = c; else delete it.votes[member];
    if(S.members.indexOf(member) < 0) S.members.push(member);
    send({ op:"setVote", itemId:it.id, member:member, r:c.r, n:c.n || "", t:c.t });
    save(); closeSheet(); render(); toast(msg);
  }
  function addMember(){
    var name = $("#newMember").value.trim();
    if(!name) return;
    if(BAD[name]){ toast("這個名字不能用，請換一個"); return; }
    apply(name);
  }

  // 找餐廳：按導航圖示是開 Google 地圖（連結本身處理）；按卡片其他地方是進詳情頁
  function openPlace(e){
    if(e.target.closest(".pgo")) return;
    var card = e.target.closest(".pcard");
    if(!card) return;
    if(e.type === "keydown" && e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault();
    FOpen = ""; PDscroll = window.scrollY; PDpushed = true;
    location.hash = "#find/" + card.dataset.i;
    window.scrollTo(0, 0);
  }
  document.addEventListener("click", openPlace);
  document.addEventListener("keydown", openPlace);

  $("#fpanel").addEventListener("change", function(e){
    var k = e.target.dataset.k, a = FA[FOpen], i = a ? a.indexOf(k) : -1;
    if(!a || k === undefined) return;
    if(e.target.checked && i < 0) a.push(k); else if(!e.target.checked && i >= 0) a.splice(i, 1);
    renderFind();
  });
  document.addEventListener("click", function(e){
    if(FOpen && !e.target.closest("#fwrap")){ FOpen = ""; renderFind(); }
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && FOpen){ FOpen = ""; renderFind(); }
  });

  document.addEventListener("click", function(e){
    var b = e.target.closest("button");
    if(!b) return;
    var act = b.dataset.act;
    if(act === "view") setView(b.dataset.v);
    else if(act === "fmode"){
      if(b.dataset.m === "all"){ FA = { county:[], district:[], type:[] }; FOpen = ""; }
      else FOpen = FOpen === b.dataset.m ? "" : b.dataset.m;
      renderFind();
    }
    else if(act === "dback"){
      if(PDpushed){ PDpushed = false; history.back(); }
      else { try{ history.replaceState(null, "", "#find"); }catch(err){} renderFind(); }
    }
    else if(act === "dcopy"){
      var v = b.dataset.v;
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(function(){ toast("已複製地址"); }, function(){ toast("複製失敗，請手動選取"); });
      else toast("這個瀏覽器不能複製，請手動選取");
    }
    else if(act === "fpclear"){ FA[FOpen] = []; renderFind(); }
    else if(act === "fclose"){ FOpen = ""; renderFind(); }
    else if(act === "pickrest"){ setCurrent(b.dataset.id); closeRestForm(); closeDrawer(); render(); }
    else if(act === "addrest") openRestForm("add");
    else if(act === "gotoitem") gotoItem(b.dataset.id);
    else if(act === "rate") openSheet(b.dataset.id, b.dataset.v);
    else if(act === "note") openSheet(b.dataset.id, null);
    else if(act === "editnote") openEdit(b.dataset.id, b.dataset.m);
    else if(act === "delitem"){
      arm(b, "確定刪除", function(){
        S.items = S.items.filter(function(i){ return i.id !== b.dataset.id; });
        send({ op:"delItem", id:b.dataset.id });
        save(); render();
      });
    } else if(act === "delnote"){
      arm(b, "確定？", function(){
        var it = findItem(b.dataset.id), m = b.dataset.m;
        if(it && it.votes && it.votes[m]){
          var v = it.votes[m];
          v.n = ""; v.t = Date.now();
          if(!v.r) delete it.votes[m];
          send({ op:"setVote", itemId:it.id, member:m, r:v.r || "", n:"", t:v.t });
          save(); render();
        }
      });
    } else if(b.classList.contains("mbtn")){
      apply(b.dataset.m);
    }
  });
  $("#addMember").addEventListener("click", addMember);
  $("#newMember").addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); addMember(); } });
  $("#sheetClose").addEventListener("click", closeSheet);
  $("#noteSave").addEventListener("click", saveEdit);
  $("#sheetBack").addEventListener("click", closeSheet);
  $("#sheet").addEventListener("click", function(e){ if(e.target === $("#sheet")) closeSheet(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
  $("#menuBtn").addEventListener("click", function(){ setDrawer(!$("#side").classList.contains("open")); });
  $("#backdrop").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeDrawer(); });
  window.addEventListener("hashchange", function(){
    var h = (location.hash || "").replace(/^#/, "");
    if(/^find(\/\d+)?$/.test(h)){ if(view !== "find"){ view = "find"; render(); } else renderFind(); }
    else if(h && findRest(h) && (h !== cur || view !== "review")){ cur = h; view = "review"; render(); }
  });

  $("#addForm").addEventListener("submit", function(e){
    e.preventDefault();
    var name = $("#newName").value.trim();
    if(!name) return;
    var dup = S.items.some(function(i){ return i.rid === cur && i.name.trim().toLowerCase() === name.toLowerCase(); });
    if(dup){ toast("已經有「" + name + "」了"); return; }
    var it = { id:newId(), rid:cur, name:name, votes:{} };
    S.items.push(it);
    send({ op:"addItem", id:it.id, name:name, rid:cur });
    save();
    $("#newName").value = "";
    render();
    $("#newName").focus();
  });

  pickCurrent();
  pickView();
  render();
  startSync();
})();

</script>
</body>
</html>
